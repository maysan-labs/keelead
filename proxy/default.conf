# KeeLead edge: HTTP Basic auth in front of an app that has no authentication of its own.
#
# Everything under `/` requires credentials, including /api/*. `/healthz` is deliberately
# exempt so the deployment can be monitored from outside without storing the password in a
# watchdog — it proxies to the app's own /api/health (app + database status).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # Resolve the upstream per request (Docker's embedded DNS) rather than at config load:
  # nginx then starts even if the app container is not listening yet, and keeps working when
  # the app is recreated with a new IP. The service name is the one in dokploy-compose.yml.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $upstream http://keelead:3000;

  client_max_body_size 25m;

  location = /healthz {
    auth_basic off;
    proxy_pass $upstream/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  location / {
    auth_basic "KeeLead (Maysan Labs)";
    auth_basic_user_file /etc/nginx/htpasswd;

    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Chat responses stream; buffering them would make the UI look hung.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
